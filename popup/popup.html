<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blush for Canvas</title>
<link rel="stylesheet" href="../styles/theme.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main>
  <p class="eyebrow"><b>//</b> settings</p>
  <h1>Blush for Canvas</h1>

  <fieldset>
    <legend>Theme</legend>
    <div class="seg" role="radiogroup" aria-label="Theme">
      <input type="radio" name="theme" id="t-auto" value="auto"><label for="t-auto">Auto</label>
      <input type="radio" name="theme" id="t-light" value="light"><label for="t-light">Light</label>
      <input type="radio" name="theme" id="t-dark" value="dark"><label for="t-dark">Dark</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>You</legend>
    <div class="field"><label for="name">Name in the greeting</label><input class="text" id="name" placeholder="Uses your Canvas name if empty" maxlength="30" autocomplete="off"></div>
  </fieldset>

  <fieldset>
    <legend>Banner</legend>
    <div class="row"><label for="hero">Greeting banner<small>Clock, focus, and next due on every page</small></label><input class="switch" type="checkbox" id="hero"></div>
    <div class="field">
      <span id="src-label" style="font-weight:600">Pictures</span>
      <div class="seg two" role="radiogroup" aria-labelledby="src-label">
        <input type="radio" name="src" id="s-both" value="both"><label for="s-both">Both</label>
        <input type="radio" name="src" id="s-art" value="art"><label for="s-art">Paintings</label>
        <input type="radio" name="src" id="s-mine" value="mine"><label for="s-mine">Mine</label>
      </div>
      <p class="hint">Paintings are public-domain works from the Art Institute of Chicago, a new one each day.</p>
    </div>
    <div class="photos" id="photos" aria-label="Your photos"></div>
    <label class="add-photo">Add your own photos<input type="file" id="file" accept="image/*" multiple></label>
  </fieldset>

  <fieldset>
    <legend>Speed and focus</legend>
    <div class="row"><label for="calm">Calm mode<small>Turns off Canvas animations</small></label><input class="switch" type="checkbox" id="calm"></div>
    <div class="row"><label for="hideClutter">Declutter<small>Hides footer, card images, duplicate to-do</small></label><input class="switch" type="checkbox" id="hideClutter"></div>
    <div class="row"><label for="prefetch">Instant navigation<small>Preloads links you hover</small></label><input class="switch" type="checkbox" id="prefetch"></div>
    <div class="row"><label for="shortcuts">Single-key shortcuts<small>Press <kbd>?</kbd> on Canvas for the list</small></label><input class="switch" type="checkbox" id="shortcuts"></div>
    <div class="row"><label for="cheers">Cheers<small>Little notes when you finish things</small></label><input class="switch" type="checkbox" id="cheers"></div>
  </fieldset>
  <p class="foot"><kbd>Ctrl</kbd> + <kbd>K</kbd> opens quick jump on any Canvas page.</p>
</main>
<script src="popup.js"></script>
</body>
</html>
